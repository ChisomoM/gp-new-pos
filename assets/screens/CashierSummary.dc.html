<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cashier summary</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;600;700;800&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f9fafb;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
a{text-decoration:none;}
.gp-num{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.gp-scroll::-webkit-scrollbar{display:none;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#f9fafb;">

  <div style="flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:18px 16px;background:#ffffff;border-bottom:1px solid #f3f4f6;">
    <a href="TransactionHistory.dc.html" aria-label="Back" style="width:34px;height:34px;border-radius:10px;background:#f7f8fa;display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#272f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;color:#141a34;">Cashier summary</div>
  </div>

  <div class="gp-scroll" style="flex:1;overflow-y:auto;padding:20px;box-sizing:border-box;">

    <div style="display:flex;gap:8px;">
      <button style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid #eef0f5;border-radius:12px;background:#ffffff;font-size:13px;font-weight:600;color:#272f4a;">
        Today
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#70788f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid #eef0f5;border-radius:12px;background:#ffffff;font-size:13px;font-weight:600;color:#272f4a;">
        All statuses
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#70788f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <div style="margin-top:16px;background:linear-gradient(160deg,#080c30 0%,#131850 45%,#383d92 100%);border-radius:18px;padding:22px;">
      <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.05em;">Total amount</div>
      <div class="gp-num" style="font-weight:700;font-size:34px;color:#ffffff;margin-top:6px;">ZMW 43.00</div>
      <div style="font-size:12.5px;color:rgba(255,255,255,0.6);margin-top:4px;">Across 5 transactions today</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <div style="flex:1;background:#f0fdf6;border-radius:14px;padding:16px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:7px;height:7px;border-radius:50%;background:#10b981;"></span>
          <span style="font-size:12px;font-weight:600;color:#065f46;">Successful</span>
        </div>
        <div class="gp-num" style="font-size:20px;font-weight:700;color:#065f46;margin-top:8px;">ZMW 34.00</div>
        <div style="font-size:11.5px;color:#0f7a56;margin-top:2px;">3 transactions</div>
      </div>
      <div style="flex:1;background:#fef2f2;border-radius:14px;padding:16px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:7px;height:7px;border-radius:50%;background:#ef4444;"></span>
          <span style="font-size:12px;font-weight:600;color:#991b1b;">Failed</span>
        </div>
        <div class="gp-num" style="font-size:20px;font-weight:700;color:#991b1b;margin-top:8px;">ZMW 9.00</div>
        <div style="font-size:11.5px;color:#b91c1c;margin-top:2px;">2 transactions</div>
      </div>
    </div>

    <div style="margin-top:10px;background:#ffffff;border:1px solid #eef0f5;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;">
      <span style="width:38px;height:38px;border-radius:10px;background:#ececf8;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#383d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </span>
      <div>
        <div class="gp-num" style="font-size:18px;font-weight:700;color:#141a34;">5</div>
        <div style="font-size:12px;color:#70788f;">Total transactions today</div>
      </div>
    </div>

  </div>

  <div style="flex:0 0 auto;padding:14px 20px 22px;background:#ffffff;border-top:1px solid #f3f4f6;">
    <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:none;border-radius:12px;background:linear-gradient(115deg,#383d92 0%,#2b6fc2 48%,#00afeb 100%);color:#ffffff;font-size:15px;font-weight:600;box-shadow:0 4px 16px rgba(0,175,235,0.30),0 1px 3px rgba(56,61,146,0.20);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print summary
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
