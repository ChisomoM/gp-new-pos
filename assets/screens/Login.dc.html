<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f9fafb;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:#383d92;}
a:hover{color:#00afeb;}
input{font-family:inherit;box-sizing:border-box;}
input:focus{outline:none;border-color:#383d92 !important;box-shadow:0 0 0 3px rgba(56,61,146,0.14);}
button{font-family:inherit;cursor:pointer;}
.login-hero{position:relative;overflow:hidden;}
.login-hero::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(0,175,235,0.38) 0%,rgba(0,175,235,0) 70%);top:-170px;right:-130px;}
.login-hero::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(56,61,146,0.55) 0%,rgba(56,61,146,0) 70%);bottom:-160px;left:-110px;}
.gp-field:focus-within .gp-label{color:#383d92;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#f9fafb;">

  <div class="login-hero" style="flex:0 0 316px;background:linear-gradient(160deg,#080c30 0%,#131850 48%,#383d92 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;">
    <img src="/_blob/35c3fb18d56fb1b4790c3482085fb9d5" alt="Geepay" style="width:190px;height:auto;z-index:1;position:relative;">
    <div style="font-size:13px;line-height:1.5;color:rgba(255,255,255,0.72);text-align:center;max-width:250px;z-index:1;position:relative;">Secure access to the Merchant Portal</div>
  </div>

  <div style="flex:1;background:#ffffff;border-radius:28px 28px 0 0;margin-top:-28px;box-shadow:0 -8px 24px rgba(8,12,48,0.06);padding:34px 24px 22px;display:flex;flex-direction:column;gap:20px;">

    <div>
      <h1 style="margin:0 0 4px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:24px;color:#0c1040;">Welcome back</h1>
      <p style="margin:0;font-size:14px;color:#70788f;">Log in to continue to your Merchant Portal</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="gp-field">
        <label class="gp-label" style="display:block;font-size:13px;font-weight:600;color:#272f4a;margin-bottom:6px;">Email address</label>
        <input type="email" placeholder="you@business.com" style="width:100%;padding:14px 16px;border:1.5px solid #dde0eb;border-radius:12px;font-size:15px;color:#141a34;background:#f9fafb;">
      </div>

      <div class="gp-field">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <label class="gp-label" style="font-size:13px;font-weight:600;color:#272f4a;">Password</label>
          <button onClick="{{togglePassword}}" style="background:none;border:none;padding:0;font-size:13px;font-weight:600;color:#383d92;">{{toggleLabel}}</button>
        </div>
        <input type="{{pwType}}" placeholder="••••••••" style="width:100%;padding:14px 16px;border:1.5px solid #dde0eb;border-radius:12px;font-size:15px;color:#141a34;background:#f9fafb;">
      </div>

      <div style="display:flex;justify-content:flex-end;">
        <a href="ResetPassword.dc.html" style="font-size:13px;font-weight:600;">Forgot password?</a>
      </div>
    </div>

    <button style="width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(115deg,#383d92 0%,#2b6fc2 48%,#00afeb 100%);color:#ffffff;font-size:15px;font-weight:600;box-shadow:0 4px 16px rgba(0,175,235,0.30),0 1px 3px rgba(56,61,146,0.20);display:flex;align-items:center;justify-content:center;gap:8px;">
      Log in
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>

    <div style="margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding-top:8px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span style="font-size:12px;color:#9aa0b8;">Protected by Geepay Security Engine</span>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const showPassword = !!this.state.showPassword;
    return {
      showPassword,
      pwType: showPassword ? 'text' : 'password',
      toggleLabel: showPassword ? 'Hide' : 'Show',
      togglePassword: () => this.setState({ showPassword: !this.state.showPassword })
    };
  }
}
</script>
</body>
</html>
